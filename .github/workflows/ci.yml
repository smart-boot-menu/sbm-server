name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sbm-server
      - uses: actions/checkout@v4
        with:
          repository: smart-boot-menu/sbm-common
          ref: 4b432228caae40479d28c8f6f48fb7cb9cc6df85
          path: sbm-common
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sbm-server/web/package-lock.json
      - name: Build the dashboard
        working-directory: sbm-server/web
        run: npm ci && npm run build
      - name: Format, lint, and test
        working-directory: sbm-server
        run: |
          test -f README.md && test -f AGENTS.md
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --workspace
