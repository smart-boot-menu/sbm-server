[package]
name = "sbm-server"
description = "Optional self-hosted Smart Boot Menu management server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sbm-server"
path = "src/main.rs"

[dependencies]
sbm-protocol.workspace = true
sbm-types.workspace = true
sbm-wire.workspace = true
axum.workspace = true
tokio.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
ed25519-dalek.workspace = true
rcgen.workspace = true
rustls.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
rustls-pemfile = "2"
x509-parser = "0.18"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout", "limit"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid.workspace = true
hex.workspace = true
sha2.workspace = true
base64.workspace = true
subtle.workspace = true
time.workspace = true
url.workspace = true
getrandom.workspace = true
thiserror.workspace = true
webauthn-rs = "0.6.2"
rust-embed = "8"
toml = "0.9"
signature.workspace = true

[dev-dependencies]
sbm-sim = { path = "../sbm-sim" }
reqwest.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
