[package]
name = "sbm-sim"
description = "Labeled simulated Smart Boot Menu device client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sbm-sim"
path = "src/main.rs"

[dependencies]
sbm-protocol.workspace = true
sbm-types.workspace = true
sbm-wire.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
base64.workspace = true
rustls.workspace = true
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
